name: Validate and deploy GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject credential-shaped repository content and history
        shell: bash
        run: |
          set -euo pipefail
          pattern='sb_secret_[A-Za-z0-9_-]{16,}|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'
          if git grep -IEn "${pattern}" -- .; then
            echo 'Credential-shaped content exists in the working tree.' >&2
            exit 1
          fi
          while IFS= read -r commit; do
            if git grep -IEn "${pattern}" "${commit}" -- .; then
              echo "Credential-shaped content exists in commit ${commit}." >&2
              exit 1
            fi
          done < <(git rev-list --all)

      - name: Audit production dependencies
        run: pnpm audit --audit-level=moderate

      - name: Verify organization migration ordering
        run: pnpm test:migration-order

      - name: Lint, typecheck, and unit tests
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:ui
          pnpm test:a11y

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Prebuild with a non-secret publishable placeholder
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_1234567890
        run: pnpm build --base /ci/

      - name: Scan and verify the built artifact
        shell: bash
        run: |
          set -euo pipefail
          pattern='sb_secret_[A-Za-z0-9_-]{16,}|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'
          if grep -RIE "${pattern}" dist; then
            echo 'Credential-shaped content exists in dist.' >&2
            exit 1
          fi
          pnpm verify:pages /ci/

  database:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile

      - name: Start and reset local Supabase
        run: |
          pnpm supabase start
          pnpm supabase db reset --local --no-seed

      - name: Run RLS and RPC database tests
        run: pnpm supabase test db --local supabase/tests/rls.sql

      - name: Generate and structurally diff public Database types
        shell: bash
        run: |
          set -euo pipefail
          pnpm supabase gen types typescript --local --schema public > src/cloud/database.types.generated.ts
          cat > database-types.check.ts <<'EOF'
          import type { Database as Checked } from './src/cloud/database.types'
          import type { Database as Generated } from './src/cloud/database.types.generated'
          type Assert<T extends true> = T
          type StripRelationships<T> = T extends { Row: infer R, Insert: infer I, Update: infer U } ? { Row: R, Insert: I, Update: U } : T
          type PublicShape<P extends { Tables: object }> = Omit<P, 'Tables'> & { Tables: { [K in keyof P['Tables']]: StripRelationships<P['Tables'][K]> } }
          type CheckedPublic = PublicShape<Checked['public']>
          type GeneratedPublic = PublicShape<Generated['public']>
          type CheckedCoversGenerated = Assert<CheckedPublic extends GeneratedPublic ? true : false>
          type GeneratedCoversChecked = Assert<GeneratedPublic extends CheckedPublic ? true : false>
          const checked: CheckedCoversGenerated = true
          const generated: GeneratedCoversChecked = true
          void checked
          void generated
          EOF
          pnpm exec tsc --noEmit --strict --skipLibCheck --module esnext --moduleResolution bundler --target es2022 database-types.check.ts

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase stop --no-backup

      - name: Remote advisor gate notice
        run: echo 'After applying migrations remotely, run pnpm supabase db advisors --linked and resolve all security/performance findings before approving the github-pages environment.'

  build:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    needs: [quality, database]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Vite base path
        id: base
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          repository_name="${REPOSITORY#*/}"
          if [[ "${repository_name,,}" == "${REPOSITORY_OWNER,,}.github.io" ]]; then
            base_path="/"
          else
            base_path="/${repository_name}/"
          fi
          echo "path=${base_path}" >> "${GITHUB_OUTPUT}"

      - name: Validate publishable Supabase variables
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [[ ! "${VITE_SUPABASE_URL}" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?/?$ ]]; then
            echo 'VITE_SUPABASE_URL must be an HTTPS origin without credentials, query, hash, or path.' >&2
            exit 1
          fi
          if [[ ! "${VITE_SUPABASE_PUBLISHABLE_KEY}" =~ ^sb_publishable_[A-Za-z0-9_-]{20,}$ ]]; then
            echo 'VITE_SUPABASE_PUBLISHABLE_KEY must be a publishable key.' >&2
            exit 1
          fi
          if [[ "${VITE_SUPABASE_PUBLISHABLE_KEY}" =~ ^sb_secret_ || "${VITE_SUPABASE_PUBLISHABLE_KEY}" == *service_role* || "${VITE_SUPABASE_PUBLISHABLE_KEY}" =~ ^eyJ ]]; then
            echo 'A secret, service-role, or JWT credential cannot be published.' >&2
            exit 1
          fi

      - name: Build production site
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm build --base "${{ steps.base.outputs.path }}"

      - name: Verify and scan GitHub Pages build
        shell: bash
        run: |
          set -euo pipefail
          pattern='sb_secret_[A-Za-z0-9_-]{16,}|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'
          if grep -RIE "${pattern}" dist; then
            echo 'Credential-shaped content exists in dist.' >&2
            exit 1
          fi
          pnpm verify:pages "${{ steps.base.outputs.path }}"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    if: needs.build.result == 'success' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
